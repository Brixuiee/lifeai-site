<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Lifeai - AI automation, starting with where to begin. AI 자동화 컨설팅.">
<title>Lifeai</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap">
<style>
/* 레이아웃: 상단 바(이름+언어 전환) → 헤드라인 → 문제 → 해결 4단계 → 증거 → 문의. 한 열, 넓은 화면에서만 2열 */
:root{--bg:#f7f6f1;--card:#fffffb;--fg:#1d2420;--mut:#5f6a64;--line:#dcdcd2;--acc:#2a6f55;--accfg:#fff;--soft:#e4efe8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121815;--card:#1a221e;--fg:#e9efeb;--mut:#a0aca5;--line:#2f3a34;--acc:#6fcaa0;--accfg:#0c1511;--soft:#1c2c25;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121815;--card:#1a221e;--fg:#e9efeb;--mut:#a0aca5;--line:#2f3a34;--acc:#6fcaa0;--accfg:#0c1511;--soft:#1c2c25;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0}
body{background:var(--bg);color:var(--fg);font:17px/1.7 "Noto Sans KR",system-ui,sans-serif;padding-block:0;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.w{max-width:880px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;padding-block:18px;gap:12px}
.logo{font:700 24px "Noto Serif KR",serif;letter-spacing:-.01em}.logo i{font-style:normal;color:var(--acc)}
.lang{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.lang button{border:0;background:none;color:var(--mut);font:500 14px inherit;padding:6px 14px;cursor:pointer}.lang button[aria-pressed="true"]{background:var(--acc);color:var(--accfg)}
h1{font:700 clamp(30px,6vw,48px)/1.25 "Noto Serif KR",serif;margin:0;text-wrap:balance;letter-spacing:-.02em}
h2{font:700 26px/1.35 "Noto Serif KR",serif;margin:0 0 14px;text-wrap:balance}
section{padding-block:44px;border-top:1px solid var(--line)}
.hero{padding-block:48px 56px;border-top:0}.hero p{max-width:34em;color:var(--mut);margin:18px 0 26px}
.btn{display:inline-block;background:var(--acc);color:var(--accfg);font:700 16px "Noto Sans KR",sans-serif;padding:13px 22px;border-radius:8px;border:0;text-decoration:none;cursor:pointer}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.q{display:grid;gap:12px;padding:0;margin:0;list-style:none}.q li{padding:16px 18px;border-left:3px solid var(--acc);background:var(--card)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;padding:0;margin:0;list-style:none;counter-reset:s}
.steps li{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;counter-increment:s}
.steps li::before{content:counter(s);display:block;font:700 13px "Noto Sans KR";color:var(--acc);margin-bottom:6px}.steps b{display:block;margin-bottom:4px}
.steps span,.pf span{color:var(--mut);font-size:15px}
.pf{display:grid;gap:14px}.pf div{padding:16px 18px;background:var(--soft);border-radius:10px}.pf b{display:block}
.tag{display:inline-block;font-size:12px;border:1px solid var(--acc);color:var(--acc);border-radius:99px;padding:0 8px;margin-left:6px;vertical-align:middle}
form{display:grid;gap:14px;max-width:560px}label{font-size:14px;color:var(--mut);display:block;margin-bottom:3px}
input,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}
.mail{margin-top:18px;color:var(--mut);font-size:15px}.mail b{color:var(--fg);overflow-wrap:anywhere}
.mail button{margin-left:6px;font:500 13px "Noto Sans KR";border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px;padding:3px 10px;cursor:pointer}
.row{display:flex;flex-wrap:wrap;gap:10px}.btn.alt{background:var(--card);color:var(--fg);border:1px solid var(--line)}
.note{font-size:14px;color:var(--mut)}#msg{min-height:1.5em;font-size:15px;color:var(--acc)}
footer{border-top:1px solid var(--line);padding-block:26px 40px;color:var(--mut);font-size:14px}
</style>
</head>
<body>
<div class="w">
 <header><div class="logo">Life<i>ai</i></div>
  <div class="lang" role="group" aria-label="Language"><button type="button" data-l="ko" aria-pressed="true">한국어</button><button type="button" data-l="en" aria-pressed="false">English</button></div></header>
 <section class="hero"><h1 data-k="h1"></h1><p data-k="sub"></p><a class="btn" href="#contact" data-k="cta"></a></section>
 <section><h2 data-k="pH"></h2><ul class="q"><li data-k="p1"></li><li data-k="p2"></li><li data-k="p3"></li></ul></section>
 <section><h2 data-k="sH"></h2><ol class="steps">
  <li><b data-k="s1t"></b><span data-k="s1d"></span></li><li><b data-k="s2t"></b><span data-k="s2d"></span></li>
  <li><b data-k="s3t"></b><span data-k="s3d"></span></li><li><b data-k="s4t"></b><span data-k="s4d"></span></li></ol></section>
 <section><h2 data-k="eH"></h2><div class="pf">
  <div><b data-k="e1t"></b><span data-k="e1d"></span></div>
  <div><b><span data-k="e2t" style="color:inherit;font-size:inherit"></span><span class="tag" data-k="tag"></span></b><span data-k="e2d"></span></div></div></section>
 <section id="contact"><h2 data-k="cH"></h2><p class="note" data-k="cP"></p>
  <form id="f">
   <div><label for="co" data-k="fco"></label><input id="co" required autocomplete="organization"></div>
   <div><label for="nm" data-k="fnm"></label><input id="nm" required autocomplete="name"></div>
   <div><label for="em" data-k="fem"></label><input id="em" type="email" required autocomplete="email"></div>
   <div><label for="ms" data-k="fms"></label><textarea id="ms" rows="3"></textarea></div>
   <div class="row"><button class="btn" type="submit" data-k="send"></button><a class="btn alt" id="gm" target="_blank" rel="noopener" href="https://mail.google.com/" data-k="gmail"></a></div><div id="msg" aria-live="polite"></div>
   <p class="note" data-k="priv"></p></form>
  <div class="mail"><span data-k="direct"></span> <b>brixuiee@gmail.com</b><button type="button" id="cp" data-k="copy"></button></div></section>
 <footer>© 2026 Lifeai</footer>
</div>
<script>
var MAIL="brixuiee@gmail.com";
var T={ko:{h1:"AI 자동화, 어디서 시작할지부터 함께 정합니다.",sub:"Lifeai는 기업의 반복 업무를 AI로 줄이는 컨설팅입니다. 먼저 무료 진단으로 우리 회사에서 무엇이 가능한지 확인해 보세요.",cta:"무료 진단 문의하기",
pH:"이런 고민이 있으신가요?",p1:"같은 정보를 여러 파일과 메신저에 반복해서 입력하고 있지 않나요?",p2:"견적, 재고, 문서 작업이 사람 손에 달려 있어 느리고 실수가 생기지 않나요?",p3:"AI가 필요하다는 건 알지만, 어디서부터 시작해야 할지 막막하지 않나요?",
sH:"이렇게 함께 합니다",s1t:"진단",s1d:"업무를 함께 보고 AI로 바꿀 수 있는 것을 고릅니다.",s2t:"파일럿",s2d:"작게 해 보고 효과를 확인합니다.",s3t:"구축",s3d:"효과가 확인된 것을 정식으로 만듭니다.",s4t:"유지보수",s4d:"잘 쓰이도록 돌보고 고칩니다.",
eH:"우리가 일하는 방식",e1t:"Beyond Process 접근",e1d:"업무 하나를 자동화하는 데서 끝내지 않고, 경영진이 얻는 가치까지 이어서 설계합니다.",
e2t:"시연 자료",tag:"예시 데이터",e2d:"견적 계산기, 재고·송장 확인 앱 같은 시연을 예시 데이터로 만들어 두었습니다. 실제 고객 정보는 쓰지 않았습니다. 상담 때 보여드립니다.",
cH:"무료 진단 문의",cP:"아래 내용을 적고 ‘Gmail로 열기’ 또는 ‘메일 앱으로 보내기’를 누르면 작성한 내용이 담긴 새 메일 창이 열립니다. 그 창에서 메일을 직접 보내셔야 전달됩니다.",
fco:"회사명",fnm:"담당자 이름",fem:"이메일",fms:"하고 싶은 일 (선택)",send:"메일 앱으로 보내기",gmail:"Gmail로 열기",priv:"입력하신 정보는 상담 연락에만 사용합니다.",direct:"직접 보내실 주소:",copy:"복사",
done:"메일 프로그램이 열렸습니다. 열리지 않으면 아래 주소로 직접 보내주세요.",copied:"주소를 복사했습니다.",nocopy:"복사가 안 됩니다. 주소를 직접 선택해 복사하세요.",subj:"[Lifeai 무료 진단 문의]"},
en:{h1:"AI automation, starting with where to begin.",sub:"Lifeai is a consultancy that reduces repetitive work with AI. Start with a free diagnosis to see what is possible in your company.",cta:"Ask for a free diagnosis",
pH:"Sound familiar?",p1:"Are you typing the same information into several files and chat apps?",p2:"Do quotes, stock and paperwork depend on manual work, making them slow and error-prone?",p3:"Do you know you need AI, but not where to start?",
sH:"How we work together",s1t:"Diagnose",s1d:"We review your work together and pick what AI can improve.",s2t:"Pilot",s2d:"We try it small and check the result.",s3t:"Build",s3d:"We build properly what the pilot proved.",s4t:"Maintain",s4d:"We look after it so it keeps getting used.",
eH:"How we approach the work",e1t:"The Beyond Process approach",e1d:"We do not stop at automating one task. We design toward the value it brings to management.",
e2t:"Demos",tag:"Sample data",e2d:"We have built demos such as a quote calculator and a stock and delivery-note app with sample data. No real customer information is used. We show them in a consultation.",
cH:"Free diagnosis inquiry",cP:"Fill in the form, then press ‘Open in Gmail’ or ‘Send with email app’. A new email opens with your message ready. You need to send that email yourself.",
fco:"Company",fnm:"Your name",fem:"Email",fms:"What would you like to do? (optional)",send:"Send with email app",gmail:"Open in Gmail",priv:"Your details are used only to reply to your inquiry.",direct:"Or email us directly:",copy:"Copy",
done:"Your email app should open. If it does not, please email the address below.",copied:"Address copied.",nocopy:"Copy is blocked. Please select the address and copy it.",subj:"[Lifeai free diagnosis inquiry]"}};
var L="ko";
try{var s=localStorage.getItem("lifeai-lang");if(s==="en"||s==="ko")L=s}catch(e){}
function setLang(l){L=l;document.documentElement.lang=l;document.querySelectorAll("[data-k]").forEach(function(e){e.textContent=T[l][e.getAttribute("data-k")]});
  document.querySelectorAll(".lang button").forEach(function(b){b.setAttribute("aria-pressed",String(b.getAttribute("data-l")===l))});
  try{localStorage.setItem("lifeai-lang",l)}catch(e){}}
document.querySelectorAll(".lang button").forEach(function(b){b.addEventListener("click",function(){setLang(b.getAttribute("data-l"))})});
function build(){var g=function(i){return document.getElementById(i).value.trim()};
  var body=(L==="ko"?"회사명: ":"Company: ")+g("co")+"\n"+(L==="ko"?"담당자: ":"Name: ")+g("nm")+"\n"+(L==="ko"?"이메일: ":"Email: ")+g("em")+"\n\n"+g("ms");
  var sub=T[L].subj+" "+g("co");
  document.getElementById("gm").href="https://mail.google.com/mail/?view=cm&fs=1&to="+encodeURIComponent(MAIL)+"&su="+encodeURIComponent(sub)+"&body="+encodeURIComponent(body);
  return "mailto:"+MAIL+"?subject="+encodeURIComponent(sub)+"&body="+encodeURIComponent(body)}
["co","nm","em","ms"].forEach(function(i){document.getElementById(i).addEventListener("input",build)});
document.getElementById("gm").addEventListener("click",build);
document.getElementById("f").addEventListener("submit",function(ev){ev.preventDefault();
  var url=build();
  document.getElementById("msg").textContent=T[L].done;
  try{window.location.href=url}catch(e){}});
document.getElementById("cp").addEventListener("click",function(){var m=document.getElementById("msg");
  try{navigator.clipboard.writeText(MAIL).then(function(){m.textContent=T[L].copied},function(){m.textContent=T[L].nocopy})}catch(e){m.textContent=T[L].nocopy}});
setLang(L);
</script>
</body>
</html>
